# QUICKSTART:
# Copy this file to .secrets.toml in the same folder.
# The minimum workable settings - set openai.key to your API key.
# Set github.deployment_type to "user" and github.user_token to your GitHub personal access token.
# This will allow you to run the CLI scripts in the scripts/ folder and the github_polling server.
#
# See README for details about GitHub App deployment.

[config]
# 使用 ModelScope 的 Qwen 模型，需要添加 openai/ 前缀以使用自定义 API base
model="openai/Qwen/Qwen3.5-35B-A3B"
model_weak="openai/Qwen/Qwen3.5-35B-A3B"  # 修改为可用的模型
fallback_models=["openai/Qwen/Qwen3.5-35B-A3B"]  # 修改为可用的模型

ai_timeout=300  # 5 minutes
# 为自定义模型设置最大 token 数（根据你的模型实际能力调整）
custom_model_max_tokens=262144
max_model_tokens=262144
git_provider="gitee_enterprise"
# 日志级别，DEBUG 日志会打印 LLM 请求/相应信息
log_level="DEBUG"


# is_auto_command = true # will be auto-set to true if the command is triggered by an automation

[openai]
api_base = "https://api-inference.modelscope.cn/v1"
key = "ms-e04c0c75-4430-4ebb-97c7-aa51cec4e0d9"  
# model 字段在这里不会被使用，模型名称应该在 [config] 段中设置

# OpenAI Flex Processing (optional, for cost savings)
# [litellm]
# extra_body='{"processing_mode": "flex"}'
# model_id = "" # Optional: Custom inference profile ID for Amazon Bedrock

[gitee]
# Gitee Community Edition configuration
personal_access_token=""
webhook_secret="" # webhook secret

[gitee_enterprise]
# Gitee Enterprise Edition configuration (REQUIRED - no defaults)
# python -m pr_agent.cli --pr_url http://gitee.wty.cn/enterprises/2/projects/208/pull_requests/66 review
#
# IMPORTANT: All fields below are REQUIRED. No default values provided.
# Note: Gitee Enterprise API does NOT use /openapi prefix
# URL format: http://{base_url}/enterprises/{enterprise_id}/projects/{project_id}/pull_requests/{pr_id}
url = "http://gitee.wty.cn"  # [REQUIRED] Your Gitee Enterprise base URL (NO /openapi suffix)
personal_access_token="cb4bec00141ab443c004c799ea56528b"  # [REQUIRED] Personal access token for Gitee Enterprises

[pr_reviewer] # /review #
# 审查标签功能配置
# enable_review_labels_effort: 是否启用"审查工作量"标签 (例如: "Review effort 3/5")
# enable_review_labels_security: 是否启用"安全问题"标签 (例如: "Possible security concern")
# - Gitee Enterprise API 不支持 PR 级别的 labels 相关接口
enable_review_labels_effort=false
enable_review_labels_security=false
